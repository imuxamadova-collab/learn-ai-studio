if(t==="quiz"){if(!Q.go)b=`<div class="card"><div class="row"><select onchange="Q.sub=this.value" aria-label="Subject">${Object.keys(QB).map(s=>`<option ${Q.sub===s?"selected":""}>${s}</option>`).join("")}</select><select onchange="Q.d=+this.value" aria-label="Difficulty">${["Easy (2)","Medium (3)","Hard (4)"].map((s,i)=>`<option value="${i}" ${Q.d===i?"selected":""}>${s}</option>`).join("")}</select><button class="btn" data-a="qs">Start quiz</button></div></div>`;else if(Q.i>=Q.qs.length)b=`<div class="card"><h3>Score: ${Q.s} / ${Q.qs.length}</h3><br><button class="btn" data-a="qs">Try again</button> <button class="btn g" onclick="Q.go=0;route(1)">New quiz</button></div>`;else{const q=Q.qs[Q.i];b=`<div class="card"><p class="mu">Question ${Q.i+1} of ${Q.qs.length}</p><h3>${q.q}</h3>${q.o.map((o,i)=>`<button class="opt ${Q.done?i===q.a?"ok":"":""}" data-a="qa" data-i="${i}">${o}</button>`).join("")}${Q.done?`<br><button class="btn" data-a="qn">${Q.i+1<Q.qs.length?"Next":"Finish"}</button>`:""}</div>`}}
if(t==="plan")b=fm("plan",'<div class="row"><input name="s" placeholder="Subject" aria-label="Subject" required><label>Hours/day <input name="h" type="number" value="1" min=".5" max="8" step=".5" style="width:80px"></label><label>Days/week <input name="d" type="number" value="5" min="1" max="7" style="width:70px"></label><label>Weeks <input name="w" type="number" value="4" min="1" max="8" style="width:70px"></label></div>');
if(t==="flash"){const d=DK[FC.d][FC.i];b=`<select onchange="FC.d=this.value;FC.i=0;FC.f=0;route(1)" aria-label="Deck">${Object.keys(DK).map(k=>`<option ${FC.d===k?"selected":""}>${k}</option>`).join("")}</select><br><br><div class="fc" role="button" tabindex="0" data-a="fl" onkeydown="if(event.key==='Enter')A.fl()">${FC.f?d[1]:d[0]}</div><p class="mu" style="text-align:center">Card ${FC.i+1} / ${DK[FC.d].length}. Click to flip.</p><div class="row" style="justify-content:center"><button class="btn g" data-a="fn" data-i="-1">Previous</button><button class="btn" data-a="fn" data-i="1">Next</button></div>`}
if(t==="code")b=fm("code",'<textarea name="x" aria-label="Code" placeholder="Paste HTML, CSS or JavaScript"></textarea>');
if(t==="write")b=fm("write",'<textarea name="x" aria-label="Your writing" placeholder="Paste a paragraph to review"></textarea>');
return`<section><div class="w"><h2>AI Learning Studio</h2><p class="tag">Demo mode: rule-based, no real AI connected</p><div class="tabs">${TS.map(x=>`<button class="chip ${t===x[0]?"on":""}" data-a="tool" data-i="${x[0]}">${x[1]}</button>`).join("")}</div><div style="margin-top:16px">${b}</div></div></section>`},
community(){const cs=["All",...CATS],ps=S.posts.filter(p=>P.c==="All"||p.c===P.c);return`<section><div class="w"><h2>Community</h2><div class="tabs">${cs.map(c=>`<button class="chip ${P.c===c?"on":""}" data-a="pf" data-i="${esc(c)}">${c}</button>`).join("")}</div>
<form data-f="post" class="card" style="margin:18px 0"><b>Start a discussion</b><div class="row" style="margin:10px 0"><select name="c">${CATS.map(c=>`<option>${c}</option>`).join("")}</select><select name="k"><option value="d">Discussion</option><option value="q">Question</option></select></div><input name="t" placeholder="Title" aria-label="Title" style="width:100%;margin-bottom:8px"><textarea name="b" aria-label="Details" placeholder="Details…" style="min-height:70px"></textarea><p class="err" role="alert"></p><button class="btn">Post</button></form>
${ps.map(p=>`<article class="card" style="margin-bottom:14px"><div class="row"><b>👤 ${esc(p.a)}</b><span class="pill">${p.c}</span><span class="pill">${p.q?"Question":"Discussion"}</span></div><h3 style="margin:8px 0 4px">${esc(p.t)}</h3><p class="mu">${esc(p.b)}</p><div class="row" style="margin-top:10px"><button class="btn g s" data-a="like" data-i="${p.id}" aria-pressed="${S.likes.includes(p.id)}">${S.likes.includes(p.id)?"❤️":"🤍"} ${p.l}</button><button class="btn g s" data-a="pc" data-i="${p.id}">💬 ${p.m.length}</button></div>${P.open===p.id?`<div style="margin-top:12px">${p.m.map(m=>`<p><b>${esc(m[0])}:</b> ${esc(m[1])}</p>`).join("")||'<p class="mu">No comments yet.</p>'}<form data-f="cm" data-i="${p.id}" class="row" style="margin-top:8px"><input name="x" aria-label="Comment" placeholder="${p.q?"Write an answer":"Write a comment"}" style="flex:1"><button class="btn s">Send</button></form></div>`:""}</article>`).join("")||'<p class="mu">No posts in this category yet.</p>'}</div></section>`},
about(){return`<section><div class="w" style="max-width:760px"><h2>About Learn AI Studio</h2><p class="mu" style="margin:10px 0 18px">Learn Smarter. Create More. Build Your Future. We combine structured courses with practical AI study tools so every learner can move at their own pace.</p><div class="card"><h3>Demo status</h3><ul class="mu"><li>Accounts and progress are stored locally in your browser. There is no backend.</li><li>AI tools run rule-based demo logic. Replace <code>AI.run</code> with a call to your own server to connect a real model.</li><li>Community posts and stories are sample content.</li></ul></div></div></section>`},
dashboard(){const u=S.u,en=C.filter(c=>S.en[c.id]),done=Object.values(S.en).reduce((a,e)=>a+e.length,0),tot=en.reduce((a,c)=>a+c.n,0),ov=tot?Math.round(done/tot*100):0,mx=Math.max(S.goal,...S.act),GS=["Study for "+S.goal+" minutes","Complete one lesson","Try an AI tool"],rec2=C.filter(c=>!S.en[c.id]).slice(0,3);
return`<section><div class="w"><h2>Welcome back, ${esc(u.n.split(" ")[0])} 👋</h2><div class="stats"><div class="card"><b>${ov}%</b>Overall progress</div><div class="card"><b>${done}</b>Lessons completed</div><div class="card"><b>🔥 ${S.streak}</b>Day streak</div><div class="card"><b>${S.act[day()]}/${S.goal}</b>Minutes today</div></div>
<div class="cols"><div class="card"><h3>Weekly activity (minutes)</h3><div class="ch" style="margin-top:14px">${["M","T","W","T","F","S","S"].map((d,i)=>`<div><i style="height:${S.act[i]/mx*100}%"></i>${d}</div>`).join("")}</div></div><div class="card"><h3>Daily goals</h3>${GS.map((g,i)=>`<label style="display:flex;gap:8px;margin-top:10px"><input type="checkbox" ${S.g.includes(i)?"checked":""} onclick="A.goal(${i})"> ${g}</label>`).join("")}</div></div>
<h3 style="margin-top:30px">Enrolled courses</h3>${en.length?`<div class="grid">${en.map(card).join("")}</div>`:'<p class="mu">You have not enrolled yet. <a href="#courses" style="color:var(--pr)">Browse courses</a></p>'}<h3 style="margin-top:30px">Recommended for you</h3><div class="grid">${rec2.map(card).join("")}</div><h3 style="margin-top:30px">Recent activity</h3><div class="card">${S.hist.slice(0,6).map(h=>`<p>• ${esc(h.m)} <span class="mu">· ${new Date(h.t).toLocaleDateString()}</span></p>`).join("")||'<p class="mu">Nothing yet.</p>'}</div></div></section>`},
profile(){const u=S.u,certs=C.filter(c=>prog(c)===100);return`<section><div class="w" style="max-width:800px"><div class="card row"><div class="th" style="width:80px;height:80px;margin:0;background:linear-gradient(135deg,var(--pr),var(--p2));color:#fff;font-size:32px">${esc(u.n[0].toUpperCase())}</div><div><h2 style="margin:0">${esc(u.n)}</h2><p class="mu">${esc(u.e)} · Joined ${new Date(u.j).toLocaleDateString()}</p></div></div>
<div class="cols"><div class="card"><h3>Learning history</h3>${S.hist.map(h=>`<p>• ${esc(h.m)} <span class="mu">· ${new Date(h.t).toLocaleDateString()}</span></p>`).join("")||'<p class="mu">No activity yet.</p>'}</div><div class="card"><h3>Certificates</h3>${certs.map(c=>`<p>🎓 ${c.t}</p>`).join("")||'<p class="mu">Finish every lesson in a course to earn one.</p>'}</div></div>
<form data-f="pr" class="card" style="margin-top:18px"><h3>Settings</h3><div class="row" style="margin:10px 0"><label>Name <input name="n" value="${esc(u.n)}"></label><label>Daily goal (min) <input name="g" type="number" value="${S.goal}" min="5" max="240" style="width:90px"></label></div><p class="err" role="alert"></p><button class="btn">Save</button> <button type="button" class="btn g" data-a="theme">Toggle dark mode</button> <button type="button" class="btn g" data-a="reset">Reset demo data</button></form></div></section>`}};
function route(keep){let r=(location.hash||"#home").slice(1);if(!V[r])r="home";if((r==="dashboard"||r==="profile")&&!S.u){location.hash="#home";authForm("in");return}
const y=scrollY,app=$("#app");try{app.innerHTML=V[r]()+(r==="home"||r==="about"?'<footer><div class="w">© 2026 LEARN AI STUDIO · Learn Smarter. Create More. Build Your Future.</div></footer>':"")}catch(e){app.innerHTML='<section><div class="w"><h2>Something went wrong</h2><a class="btn" href="#home">Back home</a></div></section>'}
chrome();$("#mn").classList.remove("open");if(keep)scrollTo(0,y);else scrollTo(0,0);
if(r==="home")document.querySelectorAll("[data-n]").forEach(el=>{const n=+el.dataset.n,t0=performance.now(),st=t=>{const p=Math.min((t-t0)/1200,1);el.textContent=Math.round(n*p).toLocaleString();if(p<1)requestAnimationFrame(st)};requestAnimationFrame(st)})}
addEventListener("hashchange",()=>route());route();
</script></body></html>
